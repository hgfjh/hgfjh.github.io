name: Build and deploy academic site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping production deployments without interrupting one underway.
concurrency:
  group: github-pages
  cancel-in-progress: false

# Grant the build job no more access than it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Generate static site
        run: cargo run --release --locked

      - name: Verify generated files
        run: |
          test -s dist/index.html
          test -s dist/static/style.css
          test -s dist/static/videos.js
          test -s dist/static/images/portrait.webp
          cmp static/images/portrait.webp dist/static/images/portrait.webp
          test -s dist/cv.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
